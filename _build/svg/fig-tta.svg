<svg viewBox="0 0 1200 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f2t f2d">
  <title id="f2t">Test-time adaptation for rare surgical phase recognition</title>
  <desc id="f2d">Panel a: schematic phase sequence of a gastric bypass video in which two closure phases cover 0.35 and 0.69 percent of frames. Panel b: five stages of the method, from prototype prediction through temporal filtering, adaptive thresholding, guided frame selection and human annotation, which feeds back into the prototypes. Panel c: rare-phase mean accuracy. MultiBypass140: base 25.9, temporal 51.6, combined 55.1, oracle 85.3 percent. Cataract-101: base 12.0, temporal 30.8, combined 45.3, oracle 98.7 percent.</desc>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#35307a"/>
    </marker>
  </defs>

  <!-- a: phase timeline -->
  <text x="0" y="22" font-size="20" font-weight="700" fill="#c23a64">a</text>
  <text x="26" y="22" font-size="15" fill="#17212b">Phase sequence of one gastric bypass video, 13 phases (schematic)</text>
  <g>
    <rect x="30" y="86" width="70"  height="40" fill="#d9dcf0"/>
    <rect x="100" y="86" width="96"  height="40" fill="#b9bee3"/>
    <rect x="196" y="86" width="150" height="40" fill="#d9dcf0"/>
    <rect x="346" y="86" width="118" height="40" fill="#8c92cf"/>
    <rect x="464" y="86" width="84"  height="40" fill="#d9dcf0"/>
    <rect x="548" y="86" width="176" height="40" fill="#b9bee3"/>
    <rect x="724" y="86" width="96"  height="40" fill="#d9dcf0"/>
    <rect x="820" y="86" width="62"  height="40" fill="#8c92cf"/>
    <rect x="882" y="86" width="4"   height="40" fill="#c23a64"/>
    <rect x="886" y="86" width="104" height="40" fill="#d9dcf0"/>
    <rect x="990" y="86" width="8"   height="40" fill="#c23a64"/>
    <rect x="998" y="86" width="96"  height="40" fill="#b9bee3"/>
    <rect x="1094" y="86" width="76" height="40" fill="#d9dcf0"/>
  </g>
  <line x1="30" y1="146" x2="1164" y2="146" stroke="#8a949f" marker-end="url(#ar2)"/>
  <text x="30" y="166" font-size="13" fill="#56626f">Video frames over time</text>

  <line x1="884" y1="84" x2="884" y2="58" stroke="#c23a64" stroke-width="1.5"/>
  <text x="876" y="52" font-size="13.5" fill="#c23a64" text-anchor="end">Closure of Petersen space, 0.35% of frames</text>
  <line x1="994" y1="84" x2="994" y2="58" stroke="#c23a64" stroke-width="1.5"/>
  <text x="1002" y="52" font-size="13.5" fill="#c23a64">Mesenteric defect, 0.69%</text>

  <!-- b: five stages (a real sequence) -->
  <text x="0" y="222" font-size="20" font-weight="700" fill="#c23a64">b</text>
  <text x="26" y="222" font-size="15" fill="#17212b">Test-time adaptation on an unlabeled test video</text>

  <g fill="#17212b">
    <rect x="26" y="248" width="208" height="104" rx="6" fill="#e6e6f4" stroke="#35307a"/>
    <text x="40" y="277" font-size="14.5" font-weight="700" fill="#17212b">1  Prototypes</text>
    <text x="40" y="302" font-size="13.5" fill="#35307a">cosine similarity of</text>
    <text x="40" y="321" font-size="13.5" fill="#35307a">each frame to class</text>
    <text x="40" y="340" font-size="13.5" fill="#35307a">prototypes</text>
    <rect x="258" y="248" width="208" height="104" rx="6" fill="#e6e6f4" stroke="#35307a"/>
    <text x="272" y="277" font-size="14.5" font-weight="700" fill="#17212b">2  Temporal filter</text>
    <text x="272" y="302" font-size="13.5" fill="#35307a">confidence-weighted</text>
    <text x="272" y="321" font-size="13.5" fill="#35307a">vote in a 15-frame</text>
    <text x="272" y="340" font-size="13.5" fill="#35307a">window</text>
    <rect x="490" y="248" width="208" height="104" rx="6" fill="#35307a"/>
    <text x="504" y="277" font-size="14.5" font-weight="700" fill="#ffffff">3  Adaptive threshold</text>
    <text x="504" y="302" font-size="13.5" fill="#e6e6f4">per-class cutoff at the</text>
    <text x="504" y="321" font-size="13.5" fill="#e6e6f4">75th percentile, then</text>
    <text x="504" y="340" font-size="13.5" fill="#e6e6f4">EMA prototype update</text>
    <rect x="722" y="248" width="208" height="104" rx="6" fill="#e6e6f4" stroke="#35307a"/>
    <text x="736" y="277" font-size="14.5" font-weight="700" fill="#17212b">4  Guided selection</text>
    <text x="736" y="302" font-size="13.5" fill="#35307a">5 rare-candidate frames</text>
    <text x="736" y="321" font-size="13.5" fill="#35307a">with the smallest</text>
    <text x="736" y="340" font-size="13.5" fill="#35307a">decision margin</text>
    <rect x="954" y="248" width="208" height="104" rx="6" fill="#ffffff" stroke="#c23a64" stroke-width="1.5"/>
    <text x="968" y="277" font-size="14.5" font-weight="700" fill="#17212b">5  Human annotation</text>
    <text x="968" y="302" font-size="13.5" fill="#35307a">an annotator labels the</text>
    <text x="968" y="321" font-size="13.5" fill="#35307a">5 frames; prototypes</text>
    <text x="968" y="340" font-size="13.5" fill="#35307a">are updated</text>
  </g>
  <g stroke="#35307a" stroke-width="2" fill="none">
    <line x1="236" y1="300" x2="254" y2="300" marker-end="url(#ar2)"/>
    <line x1="468" y1="300" x2="486" y2="300" marker-end="url(#ar2)"/>
    <line x1="700" y1="300" x2="718" y2="300" marker-end="url(#ar2)"/>
    <line x1="932" y1="300" x2="950" y2="300" marker-end="url(#ar2)"/>
    <path d="M1058 354 V384 H130 V358" marker-end="url(#ar2)" stroke-dasharray="6 5"/>
  </g>
  <text x="596" y="402" font-size="13" fill="#56626f" text-anchor="middle">updated prototypes</text>

  <!-- c: results -->
  <text x="0" y="452" font-size="20" font-weight="700" fill="#c23a64">c</text>
  <text x="26" y="452" font-size="15" fill="#17212b">Rare-phase mean accuracy (%), one rare-labeled training video</text>

  <!-- chart geometry: baseline y=640, 100% = 150 px -->
  <g font-size="13" fill="#56626f">
    <line x1="60" y1="640" x2="560" y2="640" stroke="#8a949f"/>
    <line x1="640" y1="640" x2="1140" y2="640" stroke="#8a949f"/>
    <line x1="60" y1="490" x2="560" y2="490" stroke="#eef0f3"/>
    <line x1="640" y1="490" x2="1140" y2="490" stroke="#eef0f3"/>
    <line x1="60" y1="565" x2="560" y2="565" stroke="#eef0f3"/>
    <line x1="640" y1="565" x2="1140" y2="565" stroke="#eef0f3"/>
    <text x="52" y="644" text-anchor="end">0</text><text x="52" y="569" text-anchor="end">50</text><text x="52" y="494" text-anchor="end">100</text>
    <text x="632" y="644" text-anchor="end">0</text><text x="632" y="569" text-anchor="end">50</text><text x="632" y="494" text-anchor="end">100</text>
  </g>
  <text x="310" y="676" font-size="14" fill="#17212b" text-anchor="middle">MultiBypass140</text>
  <text x="890" y="676" font-size="14" fill="#17212b" text-anchor="middle">Cataract-101</text>

  <!-- MB140: 25.9, 51.6, 55.1, 85.3 -->
  <rect x="90"  y="601.2" width="84" height="38.8" fill="#b9c1ca"/>
  <rect x="200" y="562.6" width="84" height="77.4" fill="#8c92cf"/>
  <rect x="310" y="557.4" width="84" height="82.6" fill="#35307a"/>
  <rect x="420" y="512.1" width="84" height="127.9" fill="none" stroke="#56626f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g font-size="14" font-weight="700" fill="#17212b" text-anchor="middle">
    <text x="132" y="594">25.9</text><text x="242" y="555">51.6</text><text x="352" y="550" fill="#35307a">55.1</text><text x="462" y="505" fill="#56626f">85.3</text>
  </g>

  <!-- Cataract-101: 12.0, 30.8, 45.3, 98.7 -->
  <rect x="670" y="622" width="84" height="18" fill="#b9c1ca"/>
  <rect x="780" y="593.8" width="84" height="46.2" fill="#8c92cf"/>
  <rect x="890" y="572" width="84" height="68" fill="#35307a"/>
  <rect x="1000" y="492" width="84" height="148" fill="none" stroke="#56626f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g font-size="14" font-weight="700" fill="#17212b" text-anchor="middle">
    <text x="712" y="615">12.0</text><text x="822" y="587">30.8</text><text x="932" y="565" fill="#35307a">45.3</text><text x="1042" y="485" fill="#56626f">98.7</text>
  </g>

  <!-- legend -->
  <g font-size="13.5" fill="#17212b">
    <rect x="620" y="432" width="14" height="14" fill="#b9c1ca"/><text x="640" y="444">Base prototype</text>
    <rect x="760" y="432" width="14" height="14" fill="#8c92cf"/><text x="780" y="444">Temporal</text>
    <rect x="862" y="432" width="14" height="14" fill="#35307a"/><text x="882" y="444">Stages 1 to 5</text>
    <rect x="990" y="432" width="14" height="14" fill="none" stroke="#56626f" stroke-dasharray="3 2"/><text x="1010" y="444">Oracle reference</text>
  </g>
</svg>
