<rect x="410" y="42" width="14" height="14" fill="#35307a"/><text x="430" y="54">Combined, stages 1 to 5, 5 annotated frames</text>
<rect x="740" y="42" width="14" height="14" fill="none" stroke="#56626f" stroke-dasharray="3 2"/><text x="760" y="54">Oracle, full rare-phase labels</text>
