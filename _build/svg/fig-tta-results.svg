<title id="f2bt">Rare-phase mean accuracy from Table 1</title>
<desc id="f2bd">MultiBypass140: base 25.9, temporal 51.6, combined 55.1, oracle 85.3 percent. Cholec80: base 29.6, temporal 61.1 percent; combined and oracle not reported under label masking. Cataract-101: base 12.0, temporal 30.8, combined 45.3, oracle 98.7 percent.</desc>
