<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f1t f1d">
  <title id="f1t">Multimodal model for peritoneal lesions during staging laparoscopy</title>
  <desc id="f1d">Panel a: an image model reads intraoperative laparoscopy frames and a morphology model reads features scored by two expert surgeons; the two outputs are fused to classify a lesion as peritoneal metastasis or benign. Panel b: area under the ROC curve on 67 patients. Multimodal model 0.88 with 95 percent confidence interval 0.77 to 0.96, expert surgeons 0.78, best image-only deep learning model 0.72.</desc>
  <defs>
    <radialGradient id="tissue" cx="45%" cy="42%" r="62%">
      <stop offset="0" stop-color="#f1b9ae"/>
      <stop offset=".55" stop-color="#cf6f6a"/>
      <stop offset="1" stop-color="#6e2630"/>
    </radialGradient>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#35307a"/>
    </marker>
  </defs>

  <text x="0" y="22" font-size="20" font-weight="700" fill="#c23a64">a</text>

  <!-- image branch -->
  <rect x="24" y="44" width="196" height="176" rx="6" fill="#0d0f12"/>
  <circle cx="122" cy="132" r="80" fill="url(#tissue)"/>
  <ellipse cx="92" cy="104" rx="9" ry="7" fill="#f6ecdc" stroke="#e3c9a8"/>
  <ellipse cx="146" cy="160" rx="12" ry="9" fill="#f7efe2" stroke="#e3c9a8"/>
  <ellipse cx="160" cy="98" rx="5" ry="4" fill="#f2e3cc"/>
  <ellipse cx="84" cy="168" rx="6" ry="5" fill="#f2e3cc"/>
  <circle cx="146" cy="160" r="22" fill="none" stroke="#f0819f" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="122" y="244" font-size="14" fill="#56626f" text-anchor="middle">Intraoperative video frame</text>

  <line x1="228" y1="132" x2="262" y2="132" stroke="#35307a" stroke-width="2" marker-end="url(#ar1)"/>
  <rect x="268" y="94" width="200" height="76" rx="6" fill="#e6e6f4" stroke="#35307a"/>
  <text x="368" y="126" font-size="16" font-weight="700" fill="#17212b" text-anchor="middle">Image model</text>
  <text x="368" y="148" font-size="13.5" fill="#35307a" text-anchor="middle">deep learning on frames</text>

  <!-- morphology branch -->
  <rect x="24" y="276" width="196" height="150" rx="6" fill="#ffffff" stroke="#b9c1ca"/>
  <g fill="#b9c1ca">
    <rect x="42" y="298" width="86" height="8" rx="4"/>
    <rect x="42" y="326" width="70" height="8" rx="4"/>
    <rect x="42" y="354" width="96" height="8" rx="4"/>
    <rect x="42" y="382" width="62" height="8" rx="4"/>
  </g>
  <g fill="#35307a">
    <circle cx="160" cy="302" r="5"/><circle cx="176" cy="302" r="5"/><circle cx="192" cy="302" r="5" fill="#d6dce2"/>
    <circle cx="160" cy="330" r="5"/><circle cx="176" cy="330" r="5" fill="#d6dce2"/><circle cx="192" cy="330" r="5" fill="#d6dce2"/>
    <circle cx="160" cy="358" r="5"/><circle cx="176" cy="358" r="5"/><circle cx="192" cy="358" r="5"/>
    <circle cx="160" cy="386" r="5"/><circle cx="176" cy="386" r="5" fill="#d6dce2"/><circle cx="192" cy="386" r="5" fill="#d6dce2"/>
  </g>
  <text x="24" y="450" font-size="14" fill="#56626f">Scored by two expert surgeons</text>

  <line x1="228" y1="350" x2="262" y2="350" stroke="#35307a" stroke-width="2" marker-end="url(#ar1)"/>
  <rect x="268" y="312" width="200" height="76" rx="6" fill="#e6e6f4" stroke="#35307a"/>
  <text x="368" y="344" font-size="16" font-weight="700" fill="#17212b" text-anchor="middle">Morphology model</text>
  <text x="368" y="366" font-size="13.5" fill="#35307a" text-anchor="middle">machine learning on scores</text>

  <!-- fusion -->
  <path d="M476 132 H520 Q540 132 540 152 V214" fill="none" stroke="#35307a" stroke-width="2"/>
  <path d="M476 350 H520 Q540 350 540 330 V268" fill="none" stroke="#35307a" stroke-width="2"/>
  <line x1="540" y1="241" x2="578" y2="241" stroke="#35307a" stroke-width="2" marker-end="url(#ar1)"/>
  <rect x="584" y="200" width="168" height="82" rx="6" fill="#35307a"/>
  <text x="668" y="236" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Multimodal</text>
  <text x="668" y="258" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">fusion</text>
  <line x1="668" y1="290" x2="668" y2="324" stroke="#35307a" stroke-width="2" marker-end="url(#ar1)"/>
  <text x="668" y="352" font-size="15" fill="#17212b" text-anchor="middle">Peritoneal metastasis</text>
  <text x="668" y="372" font-size="15" fill="#17212b" text-anchor="middle">or benign lesion</text>

  <!-- panel b: AUC -->
  <line x1="810" y1="10" x2="810" y2="450" stroke="#e6e9ed"/>
  <text x="836" y="22" font-size="20" font-weight="700" fill="#c23a64">b</text>
  <text x="862" y="22" font-size="15" fill="#17212b">Area under the ROC curve, 67 patients</text>

  <g font-size="14.5" fill="#17212b">
    <text x="840" y="84">Multimodal model</text>
    <text x="840" y="170">Expert surgeons</text>
    <text x="840" y="256">Best image-only model</text>
  </g>
  <!-- scale: 0.5 at x=840, 1.0 at x=1180 -> 680 px per unit -->
  <rect x="840" y="94" width="258" height="30" fill="#c23a64"/>
  <line x1="1024" y1="109" x2="1153" y2="109" stroke="#17212b" stroke-width="2"/>
  <line x1="1024" y1="100" x2="1024" y2="118" stroke="#17212b" stroke-width="2"/>
  <line x1="1153" y1="100" x2="1153" y2="118" stroke="#17212b" stroke-width="2"/>
  <text x="1160" y="84" font-size="15" font-weight="700" fill="#c23a64" text-anchor="end">0.88</text>

  <rect x="840" y="180" width="190" height="30" fill="#8c92cf"/>
  <text x="1038" y="201" font-size="15" font-weight="700" fill="#17212b">0.78</text>

  <rect x="840" y="266" width="150" height="30" fill="#b9c1ca"/>
  <text x="998" y="287" font-size="15" font-weight="700" fill="#17212b">0.72</text>

  <line x1="840" y1="330" x2="1180" y2="330" stroke="#8a949f"/>
  <g font-size="13" fill="#56626f" text-anchor="middle">
    <line x1="840" y1="330" x2="840" y2="337" stroke="#8a949f"/><text x="840" y="354">0.5</text>
    <line x1="908" y1="330" x2="908" y2="337" stroke="#8a949f"/><text x="908" y="354">0.6</text>
    <line x1="976" y1="330" x2="976" y2="337" stroke="#8a949f"/><text x="976" y="354">0.7</text>
    <line x1="1044" y1="330" x2="1044" y2="337" stroke="#8a949f"/><text x="1044" y="354">0.8</text>
    <line x1="1112" y1="330" x2="1112" y2="337" stroke="#8a949f"/><text x="1112" y="354">0.9</text>
    <line x1="1180" y1="330" x2="1180" y2="337" stroke="#8a949f"/><text x="1172" y="354">1.0</text>
  </g>
  <text x="840" y="392" font-size="13" fill="#56626f">Whisker: 95% confidence interval for the</text>
  <text x="840" y="410" font-size="13" fill="#56626f">multimodal model (0.77 to 0.96).</text>
</svg>
